name: GPU Worker CI

on:
  push:
    branches: [main, master]
    paths:
      - "gpu_worker/**"
      - "docker/gpu_worker.Dockerfile"
      - ".github/workflows/gpu-worker-ci.yml"
  pull_request:
    paths:
      - "gpu_worker/**"
      - "docker/gpu_worker.Dockerfile"
      - ".github/workflows/gpu-worker-ci.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check gpu_worker

  docker-build:
    name: Validate Docker build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gpu_worker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gpu_worker.Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
